[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boxrange"
version = "0.1.0"
description = "Measure the distance to a box from RealSense depth camera input."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
# pyrealsense2 has no wheel for macOS arm64; keep it optional so the package
# installs and the synthetic path runs anywhere.
realsense = ["pyrealsense2>=2.54"]
dev = ["pytest>=7.0"]

[project.scripts]
boxrange = "boxrange.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["boxrange"]

[tool.pytest.ini_options]
testpaths = ["tests"]
